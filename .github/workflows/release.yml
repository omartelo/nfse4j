name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O Central nao permite apagar nem sobrescrever uma versao publicada: tag e gradle.properties
      # divergentes precisam falhar antes do publish.
      - name: Conferir versao da tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep '^version=' gradle.properties | cut -d= -f2)"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} nao bate com version=${PROJECT_VERSION} do gradle.properties."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build e testes
        run: ./gradlew build
      - name: Publicar no Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral
      - name: Renomear jars com a versao da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp nfse4j-mcp/build/libs/nfse4j-mcp.jar "nfse4j-mcp-${VERSION}.jar"
          cp nfse4j-cli/build/libs/nfse4j-cli.jar "nfse4j-cli-${VERSION}.jar"
      - name: Criar GitHub Release com os jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Servidor MCP e CLI da versao ${VERSION}. Veja o CHANGELOG.md. O nfse4j-core e o nfse4j-danfse sao distribuidos pelo Maven Central. Componentes de terceiros agregados nos jars: THIRD-PARTY.md." \
            "nfse4j-mcp-${VERSION}.jar" \
            "nfse4j-cli-${VERSION}.jar" \
            THIRD-PARTY.md
