[versions]
junit = "5.12.2"
jackson = "2.18.2"
gson = "2.14.0"
mcp = "1.0.2"
bouncycastle = "1.78.1"
openhtmltopdf = "1.0.10"
zxing = "3.5.4"
pdfbox = "2.0.36"
shadow = "9.6.1"
maven-publish = "0.37.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
# JSON das APIs do ADN no nfse4j-core (Apache-2.0).
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
mcp = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
# HTML/CSS -> PDF (LGPL 2.1, dependencia de runtime). PDFBox e Apache-2.0.
openhtmltopdf-pdfbox = { module = "com.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
# Fixa o PDFBox acima do 2.0.24 que o openhtmltopdf 1.0.10 traz por transitividade (Apache-2.0).
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
# QR Code (Apache-2.0).
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
